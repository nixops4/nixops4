[package]
name = "nixops4-provider-wire"
version = "0.1.0"
description = "The wire contract between the NixOps4 engine and resource providers: versioned JSON Schemas and the Rust types generated from them"
edition = "2021"
license = "LGPL-2.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json-patch = "4.0"

[lib]
path = "src/lib.rs"

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1.0"
syn = "2.0"
typify = "0.4"
